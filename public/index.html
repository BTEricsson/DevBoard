<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DevBoard</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>Dev<span>Board</span></h1>
    <div class="header-right">
      <div id="status-dot" title="WebSocket disconnected"></div>
      <button id="theme-toggle">Light</button>
    </div>
  </header>

  <div class="board">
    <div class="column" id="col-backlog">
      <div class="column-header">
        <span class="dot" style="background:#a78bfa"></span>
        Backlog
        <span class="count" id="count-backlog">0</span>
      </div>
      <div class="cards" id="cards-backlog"></div>
    </div>
    <div class="column" id="col-pending">
      <div class="column-header">
        <span class="dot" style="background:var(--col-pending)"></span>
        Pending
        <span class="count" id="count-pending">0</span>
      </div>
      <div class="cards" id="cards-pending"></div>
    </div>
    <div class="column" id="col-active">
      <div class="column-header">
        <span class="dot" style="background:var(--col-active)"></span>
        Active
        <span class="count" id="count-active">0</span>
      </div>
      <div class="cards" id="cards-active"></div>
    </div>
    <div class="column" id="col-complete">
      <div class="column-header">
        <span class="dot" style="background:var(--col-complete)"></span>
        Complete
        <span class="count" id="count-complete">0</span>
      </div>
      <div class="cards" id="cards-complete"></div>
    </div>
  </div>

  <script>
    const themeBtn = document.getElementById('theme-toggle');
    let dark = true;
    themeBtn.addEventListener('click', () => {
      dark = !dark;
      document.body.classList.toggle('light', !dark);
      themeBtn.textContent = dark ? 'Light' : 'Dark';
    });

    function timeAgo(iso) {
      if (!iso) return '';
      const diff = Math.floor((Date.now() - new Date(iso)) / 1000);
      if (diff < 60) return 'just now';
      if (diff < 3600) return `${Math.floor(diff / 60)}m ago`;
      if (diff < 86400) return `${Math.floor(diff / 3600)}h ago`;
      return `${Math.floor(diff / 86400)}d ago`;
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function renderTaskItem(text, cls) {
      const icons = { 'in-progress': '◑', 'done': '✓', 'backlog': '·' };
      const icon = icons[cls] || '○';
      return `<div class="task-item ${cls}"><span class="icon">${icon}</span><span>${escHtml(text)}</span></div>`;
    }

    function renderGroup(g) {
      const total = g.todo.length + g.inProgress.length + g.done.length;
      const ticket = g.ticket ? `<span class="group-ticket">#${escHtml(g.ticket)}</span>` : '';
      const tasks = [
        ...g.inProgress.map(t => renderTaskItem(t, 'in-progress')),
        ...g.todo.map(t => renderTaskItem(t, '')),
        ...g.done.map(t => renderTaskItem(t, 'done')),
      ].join('');
      const countLabel = total ? ` ${g.done.length}/${total}` : '';
      return `
        <div class="group-block">
          <div class="group-header">
            ${ticket}
            <span class="group-name">${escHtml(g.name)}</span>
            <span class="group-status ${g.status}">${g.status}${countLabel}</span>
          </div>
          <div class="group-tasks">${tasks || '<div class="task-item"><span class="icon">—</span><span>No tasks</span></div>'}</div>
        </div>`;
    }

    function renderGroupCard(g, proj) {
      const total = g.todo.length + g.inProgress.length + g.done.length;
      const pct = total ? Math.round((g.done.length / total) * 100) : 0;
      const colorMap = { pending: '#fbbf24', active: '#60a5fa', complete: '#4ade80' };
      const fillColor = colorMap[g.status] || '#fbbf24';
      const ticket = g.ticket ? `#${escHtml(g.ticket)} ` : '';
      const tasks = [
        ...g.inProgress.map(t => renderTaskItem(t, 'in-progress')),
        ...g.todo.map(t => renderTaskItem(t, '')),
        ...g.done.map(t => renderTaskItem(t, 'done')),
      ].join('') || '<div class="task-item"><span class="icon">—</span><span>No tasks</span></div>';
      const progressLabel = total ? `${g.done.length} / ${total} tasks done` : 'No tasks';
      const cardId = escHtml(`${proj.id}__${g.ticket || g.name}`);
      const completedAtHtml = g.completedAt
        ? `<span class="group-completed-at">${escHtml(g.completedAt)}</span>`
        : '';
      const nickHtml = g.nick
        ? `<span class="nick-badge">${escHtml(g.nick)}</span>`
        : '';
      const planHtml = (proj.planTicket && proj.planTicket === g.ticket)
        ? `<span class="plan-badge">PLAN</span>`
        : '';
      const parentHtml = proj.parentName ? `<div class="card-parent">${escHtml(proj.parentName)} /</div>` : '';
      const nestedClass = proj.parentName ? ' card--nested' : '';
      return `
        <div class="card${nestedClass}" data-id="${cardId}" onclick="this.classList.toggle('expanded')">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
            <div style="display:flex;align-items:center;gap:6px">
              <span class="status-badge badge-${g.status}" style="margin-bottom:0">${g.status}</span>
              ${nickHtml}
              ${planHtml}
            </div>
            ${completedAtHtml}
          </div>
          ${parentHtml}<div class="card-name">${escHtml(proj.name)}</div>
          <div class="card-desc" style="opacity:0.5;font-size:0.72rem">${ticket}${escHtml(g.name)}</div>
          <div class="progress-bar">
            <div class="progress-fill" style="width:${pct}%;background:${fillColor}"></div>
          </div>
          <div class="progress-label">${progressLabel}</div>
          <div class="task-list">${tasks}</div>
          <div class="card-footer">
            <span>${timeAgo(proj.lastModified)}</span>
            <a class="vscode-btn" href="vscode://file/${encodeURI(proj.path)}" onclick="event.stopPropagation()">VS Code</a>
          </div>
        </div>`;
    }

    function renderCard(proj) {
      const { todo = [], inProgress = [], done = [], backlog = [], groups = [] } = proj.tasks || {};
      const total = todo.length + inProgress.length + done.length;
      const pct = total ? Math.round((done.length / total) * 100) : 0;
      const colorMap = { pending: '#fbbf24', active: '#60a5fa', complete: '#4ade80' };
      const fillColor = colorMap[proj.status] || '#fbbf24';

      // Expanded body: flat list (groups are rendered as separate cards)
      let expandedBody;
      if (false) {
        expandedBody = [
          ...inProgress.map(t => renderTaskItem(t, 'in-progress')),
          ...todo.map(t => renderTaskItem(t, '')),
          ...done.map(t => renderTaskItem(t, 'done')),
        ].join('') || '<div class="task-item"><span class="icon">—</span><span>No tasks found</span></div>';
      }

      const backlogItems = backlog.length
        ? `<div class="backlog-divider">Backlog (${backlog.length})</div>` +
          backlog.map(t => renderTaskItem(t, 'backlog')).join('')
        : '';

      const progressLabel = total
        ? `${done.length} / ${total} tasks done${backlog.length ? ` · ${backlog.length} in backlog` : ''}`
        : backlog.length ? `${backlog.length} in backlog` : 'No tasks';

      const pinnedClass = proj.statusOverride ? ' pinned' : '';
      const planHtml = proj.planTicket ? `<span class="plan-badge">PLAN</span>` : '';
      const parentHtml = proj.parentName ? `<div class="card-parent">${escHtml(proj.parentName)} /</div>` : '';
      const nestedClass = proj.parentName ? ' card--nested' : '';

      return `
        <div class="card${nestedClass}" data-id="${escHtml(proj.id)}" onclick="this.classList.toggle('expanded')">
          <span class="status-badge badge-${proj.status}${pinnedClass}">${proj.status}</span>${planHtml}
          ${parentHtml}<div class="card-name" title="${escHtml(proj.folderName || proj.name)}">${escHtml(proj.name)}</div>
          <div class="card-desc">${escHtml(proj.description || '')}</div>
          <div class="progress-bar">
            <div class="progress-fill" style="width:${pct}%;background:${fillColor}"></div>
          </div>
          <div class="progress-label">${progressLabel}</div>
          <div class="task-list">${expandedBody + backlogItems}</div>
          <div class="card-footer">
            <span>${timeAgo(proj.lastModified)}</span>
            <a class="vscode-btn" href="vscode://file/${encodeURI(proj.path)}" onclick="event.stopPropagation()">VS Code</a>
          </div>
        </div>`;
    }

    function renderBacklogCard(proj) {
      const backlog = proj.tasks.backlog || [];
      let taskListHtml;
      let progressLabel;
      let hasContent = false;

      if (backlog.length > 0) {
        hasContent = true;
        taskListHtml = backlog
          .map(t => `<div class="task-item"><span class="icon">·</span><span>${escHtml(t)}</span></div>`)
          .join('');
        progressLabel = `${backlog.length} item${backlog.length !== 1 ? 's' : ''}`;
      } else {
        const groups = proj.tasks.groups || [];
        const tail = groups.filter(g => g.status !== 'complete').slice(0, 3);
        hasContent = tail.length > 0;
        taskListHtml = tail.length
          ? tail.map(g => {
              const total = g.todo.length + g.inProgress.length + g.done.length;
              const label = g.ticket ? `#${escHtml(g.ticket)} ${escHtml(g.name)}` : escHtml(g.name);
              const count = total ? ` (${g.done.length}/${total})` : '';
              return `<div class="task-item"><span class="icon">·</span><span style="opacity:0.6">${label}${count}</span></div>`;
            }).join('')
          : `<div class="task-item"><span class="icon">—</span><span style="opacity:0.4">no backlog items</span></div>`;
        progressLabel = 'empty backlog';
      }

      const parentHtml = proj.parentName ? `<div class="card-parent">${escHtml(proj.parentName)} /</div>` : '';
      const nestedClass = proj.parentName ? ' card--nested' : '';
      return `
        <div class="card${nestedClass}" data-id="${escHtml(proj.id)}__backlog" onclick="this.classList.toggle('expanded')">
          <span class="status-badge" style="background:#a78bfa22;color:#a78bfa">backlog</span>
          ${parentHtml}<div class="card-name">${escHtml(proj.name)}</div>
          <div class="progress-label">${progressLabel}</div>
          <div class="task-list">${taskListHtml}</div>
          <div class="card-footer">
            <span>${timeAgo(proj.lastModified)}</span>
            <a class="vscode-btn" href="vscode://file/${encodeURI(proj.path)}" onclick="event.stopPropagation()">VS Code</a>
          </div>
        </div>`;
    }

    const PAGE_SIZE = 6;
    const expandedCols = new Set();
    let lastProjects = [];

    function showMore(status) {
      expandedCols.add(status);
      renderAll(lastProjects);
    }

    function renderAll(projects) {
      lastProjects = projects;
      const expanded = new Set(
        Array.from(document.querySelectorAll('.card.expanded')).map(el => el.dataset.id)
      );
      const cols = { backlog: [], pending: [], active: [], complete: [] };

      for (const p of projects) {
        // One backlog card per project (show even when backlog is empty if TODO.md exists)
        if (p.hasTodo) {
          cols.backlog.push({ id: `${p.id}__backlog`, html: renderBacklogCard(p) });
        }

        if (p.tasks.groups && p.tasks.groups.length > 0) {
          for (const g of p.tasks.groups) {
            const total = g.todo.length + g.inProgress.length + g.done.length;
            if (total === 0 && g.status === 'pending') continue;
            const col = cols[g.status] || cols.pending;
            col.push({ id: `${p.id}__${g.ticket || g.name}`, completedAt: g.completedAt || null, html: renderGroupCard(g, p) });
          }
        } else {
          const total = (p.tasks.todo || []).length + (p.tasks.inProgress || []).length + (p.tasks.done || []).length;
          if (total > 0 || p.status !== 'pending') {
            const col = cols[p.status] || cols.pending;
            col.push({ id: p.id, html: renderCard(p) });
          }
        }

        for (const nested of (p.nestedProjects || [])) {
          const np = { ...nested, id: nested.path, folderName: nested.name, parentName: p.name };
          if (np.hasTodo) {
            cols.backlog.push({ id: `${np.id}__backlog`, html: renderBacklogCard(np) });
          }
          if (np.tasks && np.tasks.groups && np.tasks.groups.length > 0) {
            for (const g of np.tasks.groups) {
              const total = g.todo.length + g.inProgress.length + g.done.length;
              if (total === 0 && g.status === 'pending') continue;
              const col = cols[g.status] || cols.pending;
              col.push({ id: `${np.id}__${g.ticket || g.name}`, completedAt: g.completedAt || null, html: renderGroupCard(g, np) });
            }
          } else if (np.tasks) {
            const total = (np.tasks.todo || []).length + (np.tasks.inProgress || []).length + (np.tasks.done || []).length;
            if (total === 0 && np.status === 'pending') continue;
            const col = cols[np.status] || cols.pending;
            col.push({ id: np.id, html: renderCard(np) });
          }
        }
      }

      cols.complete.sort((a, b) => {
        if (!a.completedAt && !b.completedAt) return 0;
        if (!a.completedAt) return 1;
        if (!b.completedAt) return -1;
        return b.completedAt.localeCompare(a.completedAt);
      });

      for (const status of ['backlog', 'pending', 'active', 'complete']) {
        const container = document.getElementById(`cards-${status}`);
        const count = document.getElementById(`count-${status}`);
        const list = cols[status];
        count.textContent = list.length;
        if (list.length === 0) {
          container.innerHTML = `<div class="empty-column">No cards</div>`;
        } else {
            const visible = expandedCols.has(status) ? list : list.slice(0, PAGE_SIZE);
          const remaining = expandedCols.has(status) ? 0 : list.length - PAGE_SIZE;
          const showMoreBtn = remaining > 0
            ? `<button class="show-more-btn" onclick="showMore('${status}')">Show ${remaining} more</button>`
            : '';
          container.innerHTML = visible.map(e => e.html).join('') + showMoreBtn;
          container.querySelectorAll('.card').forEach(el => {
            if (expanded.has(el.dataset.id)) el.classList.add('expanded');
          });
        }
      }
    }

    // Initial fetch
    fetch('/api/projects')
      .then(r => r.json())
      .then(renderAll)
      .catch(e => console.error('Fetch failed', e));

    // WebSocket
    const statusDot = document.getElementById('status-dot');
    function connect() {
      const ws = new WebSocket(`ws://${location.host}`);
      ws.onopen = () => {
        statusDot.classList.add('connected');
        statusDot.title = 'WebSocket connected';
      };
      ws.onmessage = (e) => {
        const msg = JSON.parse(e.data);
        if (msg.type === 'update') renderAll(msg.projects);
      };
      ws.onclose = () => {
        statusDot.classList.remove('connected');
        statusDot.title = 'Reconnecting...';
        setTimeout(connect, 2000);
      };
      ws.onerror = () => ws.close();
    }
    connect();
  </script>
</body>
</html>
